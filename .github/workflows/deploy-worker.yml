name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
        run: |
          METADATA=$(cat <<'METADATA'
          {
            "main_module": "worker.js",
            "compatibility_date": "2024-01-01",
            "bindings": [
              {
                "type": "kv_namespace",
                "name": "TRIALS",
                "namespace_id": "f10eab6042014c46a62257cf849c06b5"
              }
            ]
          }
          METADATA
          )
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module"

      - name: Store Resend key as CF Worker Secret
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"RESEND_KEY\",\"text\":\"${RESEND_API_KEY}\",\"type\":\"secret_text\"}"

      - name: Enable workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled": true}'

      - name: Set Cron Trigger
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/schedules" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '[{"cron": "0 * * * *"}]'

      - name: Diagnose — full step-by-step test
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          sleep 5
          mkdir -p .debug
          echo "=== GET ===" > .debug/diag.txt
          curl -s "https://iptv-trial-buyiptvnorway.medmaar.workers.dev/" >> .debug/diag.txt
          echo "" >> .debug/diag.txt
          echo "=== Full POST (real data) ===" >> .debug/diag.txt
          curl -s -X POST "https://iptv-trial-buyiptvnorway.medmaar.workers.dev/" \
            -H "Content-Type: application/json" \
            -d '{"name":"Mo Test","email":"elmaaroufi.md@gmail.com","country":"Morocco","whatsapp":"+212689299813","device":"Samsung Smart TV","notes":"test"}' \
            >> .debug/diag.txt
          echo "" >> .debug/diag.txt
          echo "=== Secrets in CF ===" >> .debug/diag.txt
          curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(s['name']) for s in d.get('result',[])]" >> .debug/diag.txt 2>&1
          cat .debug/diag.txt

      - name: Commit result
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add .debug/diag.txt
          git commit -m "debug: full diagnosis" || true
          git push || true
