name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
        run: |
          METADATA=$(cat <<'METADATA'
          {
            "main_module": "worker.js",
            "compatibility_date": "2024-01-01",
            "bindings": [
              {
                "type": "kv_namespace",
                "name": "TRIALS",
                "namespace_id": "f10eab6042014c46a62257cf849c06b5"
              }
            ]
          }
          METADATA
          )
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module"

      - name: Store Resend key as CF Worker Secret
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"RESEND_KEY\",\"text\":\"${RESEND_API_KEY}\",\"type\":\"secret_text\"}"

      - name: Enable workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled": true}'

      - name: Set Cron Trigger
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-buyiptvnorway
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/schedules" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '[{"cron": "0 * * * *"}]'

      - name: Test all pack combinations
        run: |
          sleep 5
          mkdir -p .debug
          API_KEY="35cf68cc83a3a82e1a0ac5361c7b6105"

          echo "=== sub=99 pack=37498 (Norway specific) ===" > .debug/pack_test.txt
          curl -s "https://activationpanel.net/api/api.php?action=new&type=m3u&sub=99&pack=37498&api_key=${API_KEY}&note=test_specific" >> .debug/pack_test.txt
          echo "" >> .debug/pack_test.txt

          echo "=== sub=99 pack=all ===" >> .debug/pack_test.txt
          curl -s "https://activationpanel.net/api/api.php?action=new&type=m3u&sub=99&pack=all&api_key=${API_KEY}&note=test_all" >> .debug/pack_test.txt
          echo "" >> .debug/pack_test.txt

          echo "=== sub=1 pack=37498 (1 month = uses credits) ===" >> .debug/pack_test.txt
          curl -s "https://activationpanel.net/api/api.php?action=new&type=m3u&sub=1&pack=37498&api_key=${API_KEY}&note=test_1month" >> .debug/pack_test.txt
          echo "" >> .debug/pack_test.txt

          cat .debug/pack_test.txt

      - name: Commit result
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add .debug/pack_test.txt
          git commit -m "debug: pack combination test" || true
          git push || true
