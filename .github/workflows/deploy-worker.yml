name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          METADATA='{"main_module":"worker.js","compatibility_date":"2024-01-01","bindings":[{"type":"kv_namespace","name":"TRIALS","namespace_id":"f10eab6042014c46a62257cf849c06b5"}]}'
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" -d '{"enabled":true}'

      - name: Store Resend key
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"name\":\"RESEND_KEY\",\"text\":\"${RESEND_API_KEY}\",\"type\":\"secret_text\"}"

      - name: Set Cron
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway/schedules" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            -d '[{"cron": "0 * * * *"}]'

      - name: Fresh tests NOW
        run: |
          sleep 5
          mkdir -p .debug
          API_KEY="35cf68cc83a3a82e1a0ac5361c7b6105"

          echo "=== Reseller info (current balance) ===" > .debug/fresh.txt
          curl -s "https://activationpanel.ru/api/api.php?action=reseller_info&api_key=${API_KEY}" >> .debug/fresh.txt
          echo "" >> .debug/fresh.txt

          echo "=== TEST 1: sub=3 months pack=37498 Norway ===" >> .debug/fresh.txt
          curl -s "https://activationpanel.ru/api/api.php?action=new&type=m3u&sub=3&pack=37498&api_key=${API_KEY}&note=test_3months" >> .debug/fresh.txt
          echo "" >> .debug/fresh.txt

          echo "=== TEST 2: sub=99 demo pack=37498 Norway ===" >> .debug/fresh.txt
          curl -s "https://activationpanel.ru/api/api.php?action=new&type=m3u&sub=99&pack=37498&api_key=${API_KEY}&note=test_demo" >> .debug/fresh.txt
          echo "" >> .debug/fresh.txt

          echo "=== Full worker POST ===" >> .debug/fresh.txt
          curl -s -X POST "https://iptv-trial-buyiptvnorway.medmaar.workers.dev/" \
            -H "Content-Type: application/json" \
            -d '{"name":"Mo Test","email":"elmaaroufi.md@gmail.com","country":"Morocco","whatsapp":"+212689299813","device":"Samsung Smart TV","notes":"test"}' >> .debug/fresh.txt
          echo "" >> .debug/fresh.txt

          cat .debug/fresh.txt

      - name: Commit
        run: |
          git config user.name bot && git config user.email bot@example.com
          git add .debug/fresh.txt
          git commit -m "debug: fresh test with new demo tickets" || true
          git push || true
