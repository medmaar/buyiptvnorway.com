name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          METADATA='{"main_module":"worker.js","compatibility_date":"2024-01-01","bindings":[{"type":"kv_namespace","name":"TRIALS","namespace_id":"f10eab6042014c46a62257cf849c06b5"}]}'
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-buyiptvnorway/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" -d '{"enabled":true}'

      - name: ru vs net comparison
        run: |
          sleep 5
          mkdir -p .debug
          API_KEY="35cf68cc83a3a82e1a0ac5361c7b6105"

          echo "=== .RU — reseller_info ===" > .debug/comparison.txt
          curl -s "https://activationpanel.ru/api/api.php?action=reseller_info&api_key=${API_KEY}" >> .debug/comparison.txt
          echo "" >> .debug/comparison.txt

          echo "=== .RU — sub=99 demo ===" >> .debug/comparison.txt
          curl -s "https://activationpanel.ru/api/api.php?action=new&type=m3u&sub=99&pack=all&api_key=${API_KEY}&note=test_ru" >> .debug/comparison.txt
          echo "" >> .debug/comparison.txt

          echo "=== .NET — reseller_info ===" >> .debug/comparison.txt
          curl -s "https://activationpanel.net/api/api.php?action=reseller_info&api_key=${API_KEY}" >> .debug/comparison.txt
          echo "" >> .debug/comparison.txt

          echo "=== .NET — sub=99 demo ===" >> .debug/comparison.txt
          curl -s "https://activationpanel.net/api/api.php?action=new&type=m3u&sub=99&pack=all&api_key=${API_KEY}&note=test_net" >> .debug/comparison.txt
          echo "" >> .debug/comparison.txt

          echo "=== .RU — bouquet ===" >> .debug/comparison.txt
          curl -s "https://activationpanel.ru/api/api.php?action=bouquet&api_key=${API_KEY}" >> .debug/comparison.txt
          echo "" >> .debug/comparison.txt

          cat .debug/comparison.txt

      - name: Commit
        run: |
          git config user.name bot && git config user.email bot@example.com
          git add .debug/comparison.txt
          git commit -m "debug: ru vs net" || true
          git push || true
